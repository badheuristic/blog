<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 900" role="img" aria-label="Architecture: location sources feed a readings table; a validation job turns readings into hub assessments, which are auto-updated, reviewed by people, or sent back for a new reading; a correction service writes the hubs table and a location history, which feed a dashboard and alerts.">
<g class="process"><rect x="41" y="36" width="164" height="59"/><text x="123.0" y="62" class="t">staff submissions</text><text x="123.0" y="79" class="s">app, api, otp login</text></g>
<g class="process"><rect x="230" y="36" width="164" height="59"/><text x="312.0" y="62" class="t">phone heartbeat</text><text x="312.0" y="79" class="s">hub phone gps</text></g>
<g class="process"><rect x="419" y="36" width="164" height="59"/><text x="501.0" y="62" class="t">cell-tower fixes</text><text x="501.0" y="79" class="s">particle api</text></g>
<g class="process"><rect x="608" y="36" width="164" height="59"/><text x="690.0" y="62" class="t">photos</text><text x="690.0" y="79" class="s">object storage</text></g>
<g class="store"><rect x="41" y="120" width="731" height="59"/><text x="406.5" y="146" class="t">location readings table</text><text x="406.5" y="163" class="s">source, coordinates, accuracy, time, device, app version</text></g>
<g class="process"><rect x="41" y="204" width="164" height="59"/><text x="123.0" y="230" class="t">versioned rules</text><text x="123.0" y="247" class="s">tested in CI</text></g>
<g class="process"><rect x="230" y="204" width="353" height="59"/><text x="406.5" y="230" class="t">validation job</text><text x="406.5" y="247" class="s">on new reading or schedule</text></g>
<g class="store"><rect x="308" y="288" width="220" height="59"/><text x="418.0" y="314" class="t">hub assessments</text><text x="418.0" y="331" class="s">bucket, evidence, rules version</text></g>
<g class="process"><rect x="147" y="372" width="164" height="59"/><text x="229.0" y="398" class="t">auto-update</text><text x="229.0" y="415" class="s">two signals agree</text></g>
<g class="act"><rect x="336" y="372" width="164" height="59"/><text x="418.0" y="398" class="t">review page</text><text x="418.0" y="415" class="s">confirm or drop a pin</text></g>
<g class="act"><rect x="526" y="372" width="164" height="59"/><text x="608.0" y="398" class="t">request new reading</text><text x="608.0" y="415" class="s">notify field staff</text></g>
<g class="store"><rect x="336" y="457" width="164" height="59"/><text x="418.0" y="483" class="t">review records</text><text x="418.0" y="500" class="s">pins kept separate</text></g>
<g class="process"><rect x="230" y="542" width="377" height="59"/><text x="418.5" y="568" class="t">correction service</text><text x="418.5" y="585" class="s">compare-and-set, batch approval, undo</text></g>
<g class="store"><rect x="230" y="627" width="164" height="59"/><text x="312.0" y="653" class="t">hubs table</text><text x="312.0" y="670" class="s">live coordinates</text></g>
<g class="store"><rect x="443" y="627" width="164" height="59"/><text x="525.0" y="653" class="t">location history</text><text x="525.0" y="670" class="s">old, new, why, who</text></g>
<g class="process"><rect x="230" y="712" width="377" height="59"/><text x="418.5" y="738" class="t">dashboard and alerts</text><text x="418.5" y="755" class="s">progress, confidence, failed job</text></g>
