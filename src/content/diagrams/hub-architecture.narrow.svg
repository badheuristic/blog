<text x="348" y="274" class="note" style="text-anchor:end">*re-checks on new data</text>
<text x="348" y="524" class="note" style="text-anchor:end">new submission</text>
<text x="348" y="538" class="note" style="text-anchor:end">feeds readings</text>
<g class="store"><rect x="12" y="969" width="18" height="18"/></g><text x="40" y="983" class="legend">stored in the database</text>
<g class="act"><rect x="12" y="995" width="18" height="18"/></g><text x="40" y="1009" class="legend">people act</text>
<g class="process"><rect x="12" y="1021" width="18" height="18"/></g><text x="40" y="1035" class="legend">source or process</text>
</svg>
