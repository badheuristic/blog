<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1054" role="img" aria-label="Architecture: location sources feed a readings table; a validation job turns readings into hub assessments, which are auto-updated, reviewed by people, or sent back for a new reading; a correction service writes the hubs table and a location history, which feed a dashboard and alerts.">
<g class="process"><rect x="12" y="20" width="162" height="59"/><text x="93" y="46" class="t">staff submissions</text><text x="93" y="63" class="s">app, api, otp login</text></g>
<g class="process"><rect x="186" y="20" width="162" height="59"/><text x="267" y="46" class="t">phone heartbeat</text><text x="267" y="63" class="s">hub phone gps</text></g>
<g class="process"><rect x="12" y="89" width="162" height="59"/><text x="93" y="115" class="t">cell-tower fixes</text><text x="93" y="132" class="s">particle api</text></g>
<g class="process"><rect x="186" y="89" width="162" height="59"/><text x="267" y="115" class="t">photos</text><text x="267" y="132" class="s">object storage</text></g>
<g class="store"><rect x="12" y="173" width="336" height="59"/><text x="180" y="199" class="t">location readings table</text><text x="180" y="216" class="s">source, coordinates, accuracy, time, device, app version</text></g>
<g class="process"><rect x="12" y="282" width="140" height="59"/><text x="82" y="308" class="t">versioned rules</text><text x="82" y="325" class="s">tested in CI</text></g>
<g class="process"><rect x="176" y="282" width="172" height="59"/><text x="262" y="308" class="t">validation job</text><text x="262" y="325" class="s">on new reading or schedule</text></g>
<g class="store"><rect x="70" y="366" width="220" height="59"/><text x="180" y="392" class="t">hub assessments</text><text x="180" y="409" class="s">bucket, evidence, rules version</text></g>
<g class="process"><rect x="12" y="450" width="162" height="59"/><text x="93" y="476" class="t">auto-update</text><text x="93" y="493" class="s">two signals agree</text></g>
<g class="act"><rect x="186" y="450" width="162" height="59"/><text x="267" y="476" class="t">request new reading</text><text x="267" y="493" class="s">notify field staff</text></g>
<g class="act"><rect x="99" y="548" width="162" height="59"/><text x="180" y="574" class="t">review page</text><text x="180" y="591" class="s">confirm or drop a pin</text></g>
<g class="store"><rect x="99" y="632" width="162" height="59"/><text x="180" y="658" class="t">review records</text><text x="180" y="675" class="s">pins kept separate</text></g>
<g class="process"><rect x="12" y="716" width="336" height="59"/><text x="180" y="742" class="t">correction service</text><text x="180" y="759" class="s">compare-and-set, batch approval, undo</text></g>
<g class="store"><rect x="12" y="800" width="162" height="59"/><text x="93" y="826" class="t">hubs table</text><text x="93" y="843" class="s">live coordinates</text></g>
<g class="store"><rect x="186" y="800" width="162" height="59"/><text x="267" y="826" class="t">location history</text><text x="267" y="843" class="s">old, new, why, who</text></g>
<g class="process"><rect x="12" y="884" width="336" height="59"/><text x="180" y="910" class="t">dashboard and alerts</text><text x="180" y="927" class="s">progress, confidence, failed job</text></g>
